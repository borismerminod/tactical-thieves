<div id="player-controls">
    <button id="move-btn" class="control-button" (click)="move()">Move</button>
    <button id="stealth-btn" class="control-button secondary button-inactive" (click)="stealth()">Stealth</button>
    <button id="end-btn" class="control-button" (click)="endTurn()">End Turn</button>
</div>
