<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Tactical Thieves — Game UI (POC)</title>
  <style>
    :root{
      --bg:#081223;
      --panel:#0D2330;
      --accent:#FFB84D;
      --accent-2:#7BE0C7;
      --muted:#9FB0BD;
      --card:#0f2a38;
      --tile:#113043;
      --tile-2:#0e2936;
      --white:#ffffff;
      font-family: Inter, "Segoe UI", Roboto, Arial, sans-serif;
    }
    html,body{height:100%;margin:0;background:linear-gradient(180deg,#061322 0%, #081223 100%);color:var(--white)}
    .app {
      display:grid;
      grid-template-columns: 320px 1fr 260px;
      gap:18px;
      align-items:start;
      padding:20px;
      height:100vh;
      box-sizing:border-box;
    }

    /* LEFT HUD */
    .left {
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      border-radius:12px;padding:16px;min-height:200px;
      box-shadow:0 8px 20px rgba(2,6,23,0.6);
    }
    .logo {display:flex;align-items:center;gap:12px;margin-bottom:12px}
    .logo .mark {width:48px;height:48px;border-radius:10px;background:linear-gradient(135deg,var(--accent),#FF8A5B);display:flex;align-items:center;justify-content:center;color:#071426;font-weight:800}
    .statline{display:flex;justify-content:space-between;padding:8px 0;color:var(--muted);font-weight:600}
    .avatar-list{display:flex;flex-direction:column;gap:10px;margin-top:12px}
    .avatar{
      display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;background:linear-gradient(180deg, rgba(255,255,255,0.01), rgba(255,255,255,0.02));
    }
    .avatar .dot {width:36px;height:36px;border-radius:9px;background:var(--tile-2);display:flex;align-items:center;justify-content:center}

    /* CENTER = GRID */
    .center {
      display:flex;flex-direction:column;align-items:center;justify-content:center;
    }
    .board {
      width:720px;height:540px;border-radius:12px;background:linear-gradient(180deg,#071C2A,#082033);
      padding:18px;box-shadow: 0 10px 30px rgba(2,6,23,0.6);
      display:grid;grid-template-rows: auto 1fr;gap:12px;
    }
    .board-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted)}
    .grid {
      background: linear-gradient(180deg, rgba(255,255,255,0.014), rgba(255,255,255,0.008));
      border-radius:8px;padding:12px;
      display:grid;grid-template-columns: repeat(10,1fr);grid-auto-rows:48px;gap:8px;
      width:100%;height:100%;box-sizing:border-box;
    }

    .tile {
      border-radius:8px;background:linear-gradient(180deg,var(--tile),var(--tile-2));
      display:flex;align-items:center;justify-content:center;color:var(--muted);font-weight:700;position:relative;user-select:none;
      transition:transform .12s ease, box-shadow .12s ease;
    }
    .tile:hover{transform:translateY(-6px);box-shadow:0 12px 26px rgba(0,0,0,0.45)}
    .tile.treasure{background:linear-gradient(180deg,#4b2  , #3a9); color:#04120a}
    .tile.exit{background:linear-gradient(180deg,#FFB84D,#FF8A5B); color:#071426}
    .tile.thief{background:linear-gradient(180deg,#7BE0C7,#4FC6A6); color:#04251f}

    /* RIGHT = Controls */
    .right { background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01)); border-radius:12px;padding:16px; }
    .hud {display:flex;justify-content:space-between;align-items:center;padding:8px;border-radius:10px;background:rgba(255,255,255,0.02);margin-bottom:14px}
    .gold {font-weight:800;color:var(--accent);font-size:22px}
    .controls {display:flex;flex-direction:column;gap:12px}
    .control-button{
      padding:12px;border-radius:10px;border:0;font-weight:800;cursor:pointer;font-size:15px;
      background:linear-gradient(90deg,var(--accent-2),#22c1a0); color:#042422; box-shadow:0 6px 18px rgba(2,6,23,0.4)
    }
    .control-button.secondary{background:linear-gradient(90deg,#FFB84D,#FF8A5B);color:#071426}

    .log {margin-top:14px;padding:10px;border-radius:10px;background:rgba(255,255,255,0.02);color:var(--muted);height:120px;overflow:auto;font-size:13px}

    /* small screens */
    @media (max-width:1100px){
      .app{grid-template-columns: 1fr;grid-auto-rows:auto; padding:12px;gap:12px}
      .board{width:100%}
    }
  </style>
</head>
<body>
  <div class="app" role="application" aria-label="Tactical Thieves UI mockup">
    <section class="left" aria-label="joueur info">
      <div class="logo"><div class="mark">TT</div><div><div style="font-weight:800">Tactical Thieves</div><div style="color:var(--muted);font-size:13px">Prototype POC</div></div></div>

      <div class="statline"><div>Voleurs</div><div>3</div></div>
      <div class="statline"><div>Monstres</div><div>5</div></div>
      <div class="statline"><div>Tour</div><div id="turn">1</div></div>

      <div class="avatar-list" aria-label="liste voleurs">
        <div class="avatar"><div class="dot">1</div><div><div style="font-weight:700">Rook</div><div style="color:var(--muted);font-size:13px">Move 3 · Stealth 3</div></div></div>
        <div class="avatar"><div class="dot">2</div><div><div style="font-weight:700">Sly</div><div style="color:var(--muted);font-size:13px">Move 3 · Trap 1</div></div></div>
        <div class="avatar"><div class="dot">3</div><div><div style="font-weight:700">Mira</div><div style="color:var(--muted);font-size:13px">Move 3 · Decoy 2</div></div></div>
      </div>
    </section>

    <main class="center">
      <div class="board" role="main" aria-label="aire de jeu">
        <div class="board-top">
          <div style="font-weight:800">Niveau 1 — Maison hantée</div>
          <div style="color:var(--muted)">Objectif: Atteindre la porte</div>
        </div>

        <div class="grid" id="grid" role="grid" aria-label="grille de jeu">
          <!-- 10x10 grid example: uses 10 columns + auto rows -->
          <!-- We'll create 60 tiles (6 rows * 10) for demo; in a real game it's dynamic -->
        </div>
      </div>
    </main>

    <aside class="right" aria-label="contrôles">
      <div class="hud"><div style="color:var(--muted)">Or</div><div class="gold" id="gold">120</div></div>

      <div class="controls">
        <button id="moveBtn" class="control-button">Move</button>
        <button id="stealthBtn" class="control-button secondary">Stealth</button>
        <button id="endTurnBtn" class="control-button" style="background:#d1d8ff;color:#04203b">End Turn</button>
      </div>

      <div class="log" id="log" aria-live="polite">Journal: prêt.</div>
    </aside>
  </div>

  <script>
    // GENERATE GRID (6 rows x 10 cols for demo)
    const gridEl = document.getElementById('grid');
    const rows = 6, cols = 10;
    for(let r=0;r<rows;r++){
      for(let c=0;c<cols;c++){
        const tile = document.createElement('div');
        tile.className = 'tile';
        tile.dataset.r = r; tile.dataset.c = c;
        // simple demo placement:
        if (r===rows-1 && c===cols-2){ tile.classList.add('exit'); tile.textContent='EXIT' }
        else if ((r===1 && c===2) || (r===2 && c===6) || (r===4 && c===4)) { tile.classList.add('treasure'); tile.textContent='💰' }
        else if ((r===3 && c===3) || (r===0 && c===8)) { tile.classList.add('thief'); tile.textContent='🙂' }
        else tile.textContent='';
        // click behaviour for demo
        tile.addEventListener('click', (e)=> {
          tile.style.outline = '3px solid rgba(123,224,199,0.18)';
          setTimeout(()=> tile.style.outline='', 450);
        });
        gridEl.appendChild(tile);
      }
    }

    // Simple UI interactions (POC)
    const log = document.getElementById('log');
    const goldEl = document.getElementById('gold');
    let gold = 120;
    document.getElementById('moveBtn').addEventListener('click', ()=> {
      log.innerText = 'Sélection: déplacer le voleur (mode demo).';
      flashButton('moveBtn');
    });

    document.getElementById('stealthBtn').addEventListener('click', ()=> {
      log.innerText = 'Capacité: furtivité activée (mode demo).';
      flashButton('stealthBtn');
    });

    document.getElementById('endTurnBtn').addEventListener('click', ()=> {
      const turnEl = document.getElementById('turn');
      turnEl.innerText = parseInt(turnEl.innerText)+1;
      log.innerText = 'Tour terminé. Les monstres se déplacent...';
    });

    function flashButton(id){
      const el = document.getElementById(id);
      el.style.transform = 'translateY(-4px)';
      setTimeout(()=> el.style.transform = '', 150);
    }

    // demo: collect treasure by clicking on a treasure tile
    document.querySelectorAll('.tile.treasure').forEach(t=>{
      t.addEventListener('click', ()=>{
        gold += 10;
        goldEl.textContent = gold;
        log.innerText = 'Trésor ramassé +10 or.';
        t.classList.remove('treasure');
        t.textContent = '';
        t.style.background = 'linear-gradient(180deg,var(--tile),var(--tile-2))';
      });
    });

  </script>
</body>
</html>
